<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Venture Trader — film stage</title>
<style>
  :root{ --bg:#060b14; --accent:#00d4ff; --green:#00e676; --text:#e2e8f0; --muted:#64748b; --border:#1e2d45; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:720px;overflow:hidden;background:#03060c;}
  body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);position:relative;
    -webkit-font-smoothing:antialiased;}

  /* the real app, on a camera */
  #view{position:absolute;inset:0;perspective:1700px;perspective-origin:50% 46%;overflow:hidden;opacity:0;}
  #cam{position:absolute;left:0;top:0;width:1440px;height:810px;transform-style:preserve-3d;backface-visibility:hidden;}
  #app{display:block;border:0;width:1440px;height:810px;background:var(--bg);}
  #probe{position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none;opacity:0;}
  #cursor{position:absolute;left:0;top:0;width:30px;height:30px;z-index:5;pointer-events:none;opacity:0;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.6));}
  #ring{position:absolute;left:0;top:0;z-index:4;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
    border:2.5px solid var(--accent);pointer-events:none;opacity:0;}

  /* narrator caption — fixed, outside the camera */
  #cap{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;
    padding:13px 22px;border-radius:13px;white-space:nowrap;background:rgba(6,12,24,.92);border:1px solid rgba(0,212,255,.34);
    box-shadow:0 14px 44px rgba(0,0,0,.6);opacity:0;pointer-events:none;}
  #cap i{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 12px var(--accent)}
  #cap span{font-size:18px;font-weight:600;color:#fff;letter-spacing:.1px}

  /* hook + outro cards */
  .card{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;background:
      radial-gradient(1100px 520px at 50% -12%, rgba(0,212,255,.14), transparent 60%),
      radial-gradient(820px 600px at 80% 100%, rgba(0,230,118,.07), transparent 60%),
      linear-gradient(175deg,#070d18 0%,#060b14 45%,#050912 100%);}
  .hk{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:50px;font-weight:800;letter-spacing:-1.4px;opacity:0;}
  .hk span{color:var(--accent);text-shadow:0 0 34px rgba(0,212,255,.45);}
  .stack{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .brand{display:flex;align-items:center;gap:20px;opacity:0;}
  .mark{width:82px;height:82px;border-radius:22px;display:grid;place-items:center;font-size:44px;
    background:linear-gradient(135deg,#00d4ff,#0070f3);box-shadow:0 0 34px rgba(0,212,255,.5);}
  .wordmark{font-size:64px;font-weight:800;letter-spacing:-1.5px;} .wordmark span{color:var(--accent);}
  .sub{color:var(--muted);font-weight:700;letter-spacing:.34em;text-transform:uppercase;font-size:14px;opacity:0;}
  .line{height:3px;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--green));}
  .tag{font-size:21px;opacity:0;}
  #outro .mark{width:62px;height:62px;border-radius:16px;font-size:34px;} #outro .wordmark{font-size:50px;}
  #outro .stack{gap:22px;}
  .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px;}
  .chips span{padding:8px 15px;border-radius:20px;border:1px solid var(--border);background:rgba(17,24,39,.85);
    font-size:13px;font-weight:600;opacity:0;}
  .btn{padding:13px 25px;border-radius:12px;font-weight:700;font-size:15px;color:#04121a;opacity:0;
    background:linear-gradient(135deg,#00d4ff,#0070f3);box-shadow:0 14px 40px rgba(0,212,255,.4);}
  #prog{position:absolute;left:0;bottom:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,var(--accent),var(--green));}
</style>
</head>
<body>
  <div id="view">
    <div id="cam">
      <iframe id="app" width="1440" height="810" title="Venture Trader"></iframe>
      <div id="probe"></div>
      <div id="ring"></div>
      <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l6 16 2.5-6.5L19 9 4 2z" fill="#fff" stroke="#0a1220" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div id="cap"><i></i><span id="captxt"></span></div>

  <section class="card" id="hook">
    <div class="hk" id="hk0"></div><div class="hk" id="hk1"></div><div class="hk" id="hk2"></div>
    <div class="stack">
      <div class="brand" id="h-brand"><div class="mark">📊</div><div class="wordmark">Venture <span>Trader</span></div></div>
      <div class="sub" id="h-sub">Automated Intelligence</div>
      <div class="line" id="h-line"></div>
      <div class="tag" id="h-tag"></div>
    </div>
  </section>

  <section class="card" id="outro">
    <div class="stack">
      <div class="brand" id="o-brand"><div class="mark">📊</div><div class="wordmark">Venture <span>Trader</span></div></div>
      <div class="chips" id="chips"></div>
      <div class="btn" id="o-btn">Open the dashboard</div>
      <div class="sub" id="o-sub">Automated market intelligence</div>
    </div>
  </section>

  <div id="prog"></div>
  <script src="timeline.js"></script>
  <script src="engine.js"></script>
</body>
</html>
