[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-trading"
version = "0.2.0"
description = "Quantum methods for portfolio optimisation, risk, pricing and arbitrage, with the classical baseline next to each"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Test-only: scipy and scikit-learn are independent references the suite
# checks the numpy implementations against.  The package needs neither.
test = ["pytest>=7", "scipy>=1.10", "scikit-learn>=1.3"]

[project.scripts]
quantum-trading = "quantum.cli:main"

[tool.setuptools.packages.find]
include = ["quantum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
