name: live bot

# Runs the trading engine once per US trading day, after the close.
# Paper by default. To send orders to Alpaca, set the repository variable
# QT_BROKER=alpaca and the secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY
# (see live/README.md). Real money also needs the variables ALPACA_BASE_URL
# and QT_ALLOW_REAL_MONEY=yes; either alone is refused.
# 17:07 New York time, all year: 67 minutes after the 16:00 close, off the
# top of the hour (GitHub delays or drops runs at busy times, worst on the
# hour). Pinned to New York time so daylight saving does not move it; the
# old UTC schedule ran only 30 minutes after the close in winter.
# Scheduled runs happen only on the default branch.
on:
  schedule:
    - cron: "7 17 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
  push:
    paths:
      - "live/config.json"
      - "live/real/config.json"
      - ".github/workflows/live-bot.yml"
      - "scripts/fetch_prices.py"

permissions:
  contents: read

concurrency:
  group: live-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # only to commit the bot's state
    # Price keys (optional; free sign-ups). Without them the fetch falls back
    # to Stooq and Yahoo, which block cloud servers more and more.
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
    steps:
      # Pinned to commit SHAs: a moved tag cannot run new code with the keys.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Fetch today's prices
        run: python scripts/fetch_prices.py --config live/config.json --out live/prices.csv
      - name: Run the engine on every new bar
        env:
          QT_BROKER: ${{ vars.QT_BROKER }}
          ALPACA_BASE_URL: ${{ vars.ALPACA_BASE_URL }}
          QT_ALLOW_REAL_MONEY: ${{ vars.QT_ALLOW_REAL_MONEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python -m quantum live --config live/config.json --feed live/prices.csv \
            --catch-up --poll 0 --snapshot live/snapshot.json
      # The $40 whole-share bot (live/real/). Same engine and rules as the
      # main bot, on cheaper stocks. Its "mode" line in live/real/config.json
      # is the paper/live switch; in live mode live/real/orders.json lists
      # the day's orders for a person to place (tools/tradingview_orders.py).
      # A failure here must not stop the main bot's state from being saved.
      - name: Fetch prices for the $40 bot
        id: real_fetch
        continue-on-error: true
        run: python scripts/fetch_prices.py --config live/real/config.json --out live/real/prices.csv
      - name: Run the $40 bot and write today's orders
        if: steps.real_fetch.outcome == 'success'
        continue-on-error: true
        run: |
          python -m quantum live --config live/real/config.json --feed live/real/prices.csv \
            --catch-up --poll 0 --orders live/real/orders.json
      - name: Save the bot's state
        run: |
          git config user.name "quantum-trading-bot"
          git config user.email "quantum-trading-bot@users.noreply.github.com"
          git add live/
          if git diff --cached --quiet; then
            echo "nothing new to save"
            exit 0
          fi
          git commit -m "live bot: state as of $(python -c 'import json;print(json.load(open("live/snapshot.json"))["last_date"])')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "could not push the bot state" >&2
          exit 1
