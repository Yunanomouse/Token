name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest tests -q
      - name: Smoke-test the CLI
        run: |
          python -m quantum memory --assets 10 --days 500
          python -m quantum export --qubits 3 --powers 1 -o call.qasm
          python -m quantum backtest --assets 4 --days 300 --cardinality 2 --window 120 --horizon 60
          python -m quantum qoblib --sweeps 100 --restarts 1 --solvers simulated_annealing
          python -m quantum live --replay data/prices/us_equities_1989_2018.csv --tickers AAPL,XOM,JPM,WMT --start 2013-01-01 --end 2014-06-30 --window 120 --state ci_state.json
