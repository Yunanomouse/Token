<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b3a5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Restaurant</title>
<style>
/* Office workbook look: title bar, ribbon tabs, command bar, spreadsheet grids, form panel, status bar. */
:root {
  color-scheme: light;
  --bg: #f3f3f3; --surface: #ffffff; --surface2: #f5f5f5; --head: #f0f0f0; --line: #d6d6d6; --grid: #e3e3e3;
  --ink: #1f1f1f; --muted: #616161; --accent: #0f6cbd; --accent-ink: #ffffff; --sel: #e5f0fb; --hover: #f2f7fc;
  --title: #1b3a5c; --title-ink: #ffffff;
  --ok: #107c41; --bad: #c50f1f; --warn: #9d5d00;
  --ui: "Segoe UI", "Aptos", Calibri, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1b1b1b; --surface: #262626; --surface2: #2e2e2e; --head: #303030; --line: #444; --grid: #383838;
    --ink: #ececec; --muted: #a9a9a9; --accent: #4ea1f3; --accent-ink: #0b1a2a; --sel: #1f3448; --hover: #2a3540;
    --title: #12263b; --title-ink: #ffffff;
    --ok: #5cc27f; --bad: #f1707b; --warn: #e8a33d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1b1b; --surface: #262626; --surface2: #2e2e2e; --head: #303030; --line: #444; --grid: #383838;
  --ink: #ececec; --muted: #a9a9a9; --accent: #4ea1f3; --accent-ink: #0b1a2a; --sel: #1f3448; --hover: #2a3540;
  --title: #12263b; --title-ink: #ffffff;
  --ok: #5cc27f; --bad: #f1707b; --warn: #e8a33d;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 13px; line-height: 1.4; padding-bottom: 34px; }
button, input, select { font: inherit; color: inherit; }
.titlebar { background: var(--title); color: var(--title-ink); display: flex; align-items: center; gap: 10px; padding: 8px 16px; }
.titlebar .logo { width: 22px; height: 22px; border-radius: 4px; background: #c9a24a; color: #1b1b1b; font-weight: 800; display: grid; place-items: center; font-size: 12px; }
.titlebar .name { font-weight: 600; font-size: 14px; }
.titlebar .doc { opacity: .75; font-size: 13px; }
.titlebar .status { margin-left: auto; font-size: 12px; opacity: .85; }
nav.tabs { display: flex; gap: 2px; background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto; position: sticky; top: 0; z-index: 5; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 14px 7px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 13px; }
nav.tabs button:hover { color: var(--ink); background: var(--surface2); }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.wrap { padding: 12px 16px 16px; max-width: 1400px; margin: 0 auto; }
.cmdbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 10px; }
.cmdbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.cmdbar .grow { flex: 1; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; cursor: pointer; min-height: 28px; }
.btn:hover { background: var(--hover); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type="number"], input[type="text"], select { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 3px 6px; min-height: 26px; min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.warn { color: var(--warn); font-size: 12px; }
.notice { margin-bottom: 10px; padding: 8px 12px; border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--surface); }
.notice.bad { border-left-color: var(--bad); }
.empty { padding: 20px; text-align: center; color: var(--muted); }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
h3 { font-size: 13px; font-weight: 600; margin: 0; }
/* spreadsheet grid */
.tablewrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: inherit; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--grid); padding: 4px 8px; text-align: left; vertical-align: middle; }
th { background: var(--head); font-weight: 600; color: var(--ink); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.cat td { background: var(--surface2); font-weight: 600; color: var(--accent); }
tbody tr:hover td { background: var(--hover); }
tr.sel td { background: var(--sel) !important; }
td input[type="number"] { width: 84px; text-align: right; }
td input[type="text"] { width: 100%; min-width: 110px; }
td select { min-width: 70px; }
#i-table td input[type="number"] { width: 68px; }
#i-table td input[type="text"] { min-width: 80px; }
td input, td select { border-color: transparent; background: transparent; }
td input:hover, td select:hover, td input:focus, td select:focus { border-color: var(--line); background: var(--surface); }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--accent); }
.good { color: var(--ok); font-weight: 600; }
.over { color: var(--bad); font-weight: 600; }
.chip { display: inline-block; font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 2px; color: var(--muted); }
.chip.good { border-color: var(--ok); }
.chip.bad { border-color: var(--bad); color: var(--bad); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
/* menu split view */
.split { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 12px; align-items: start; }
#r-split { grid-template-columns: minmax(0, 660px) minmax(0, 1fr); }
@media (max-width: 1000px) { .split, #r-split { grid-template-columns: 1fr; } }
.sheet tbody tr { cursor: pointer; }
.panel { background: var(--surface); border: 1px solid var(--line); display: grid; gap: 10px; padding: 12px; min-width: 0; }
.panelhead { margin: -12px -12px 0; padding: 8px 12px; background: var(--head); border-bottom: 1px solid var(--line); font-weight: 600; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fields label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.fields input, .fields select { width: 100%; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; border: 1px solid var(--line); }
.tile { padding: 8px 10px; border-right: 1px solid var(--grid); background: var(--surface); }
.tile:last-child { border-right: 0; }
.tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 11px; color: var(--muted); }
.tile.good .v { color: var(--ok); }
.tile.over .v { color: var(--bad); }
.stack { display: grid; gap: 10px; min-width: 0; }
.statusbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--title); color: var(--title-ink); font-size: 12px; padding: 6px 16px; display: flex; gap: 18px; flex-wrap: wrap; z-index: 6; }
.statusbar span b { font-weight: 600; }
.toast { position: fixed; right: 16px; bottom: 44px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 3px; z-index: 20; }
@media (max-width: 600px) { .wrap { padding: 10px 16px; } .titlebar .doc { display: none; } th, td { padding: 4px 5px; } .sheet td:first-child { min-width: 120px; } }
dialog { border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--surface); color: var(--ink); width: min(460px, calc(100vw - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlghead { padding: 10px 14px; background: var(--head); border-bottom: 1px solid var(--line); font-weight: 600; }
.dlgbody { padding: 12px 14px; display: grid; gap: 10px; }
.dlgbody label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.dlgbody input, .dlgbody select { width: 100%; color: var(--ink); }
.dlgrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.dlgfoot { display: flex; justify-content: flex-end; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface2); }
[hidden] { display: none !important; }
.method { display: grid; gap: 4px; }
.method textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.tbtn { background: transparent; color: var(--title-ink); border: 1px solid rgba(255,255,255,.45); border-radius: 3px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.tbtn:hover { background: rgba(255,255,255,.12); }
.titlebar .status { margin-left: auto; }
textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 4px 6px; width: 100%; }
.statusbar .linkbtn { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font: inherit; }
.statusbar .due { color: #ffd479; font-weight: 600; }
